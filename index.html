<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pointeur conteneurs - DP World</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; background-color: #0d0d0d; color: #ffffff; }
        .card-dark { background-color: #1a1a1a; border: 1px solid #2a2a2a; }
        .input-dark { background-color: #262626; border: 1px solid #333333; color: #ffffff; }
        .btn-orange { background-color: #ff3b30; color: white; }
        .badge-green { background-color: #1a382b; color: #34c759; border: 1px solid #24523b; }
        .badge-red { background-color: #381a1a; color: #ff453a; border: 1px solid #522424; }
    </style>
</head>
<body class="p-3 sm:p-6 min-h-screen flex justify-center items-start">

    <div class="w-full max-w-md bg-[#121212] min-h-[720px] rounded-[35px] p-4 shadow-2xl border border-[#2a2a2a] relative flex flex-col justify-between">

        <div>
            <div class="flex items-center justify-between mt-2 mb-4">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 bg-[#ff3b30] rounded-xl flex items-center justify-center text-white text-xl shadow-lg">
                        <i class="fa-solid fa-box font-bold"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-lg leading-tight">Pointeur<br>conteneurs</h1>
                        <p class="text-xs text-gray-400 font-medium">DP World Djendjen</p>
                    </div>
                </div>
                <button onclick="openModal()" class="btn-orange px-3.5 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-md">
                    <i class="fa-solid fa-plus"></i>
                    <span>+ Pointer</span>
                </button>
            </div>

            <div class="flex items-center justify-between my-4 text-xs">
                <select id="filterStatus" onchange="filterContainers()" class="input-dark px-3 py-2 rounded-xl font-medium">
                    <option value="All">Tous les états</option>
                    <option value="Bon état">Bon état</option>
                    <option value="Endommagé">Endommagé</option>
                </select>
                <span id="containerCount" class="text-gray-400 font-semibold">3 conteneurs</span>
            </div>

            <div id="containersList" class="space-y-3 overflow-y-auto max-h-[550px]">
            </div>
        </div>

        <div id="modalOverlay" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center">
            <div class="w-full max-w-md bg-[#1c1c1e] rounded-t-[28px] sm:rounded-[28px] p-5 border border-[#2c2c2e] shadow-2xl">
                
                <div class="flex items-center justify-between mb-4 border-b border-gray-800 pb-3">
                    <h3 class="font-bold text-base text-center w-full">Pointer un conteneur</h3>
                    <button onclick="closeModal()" class="text-gray-400 hover:text-white text-lg">
                        <i class="fa-solid fa-xmark"></i>
                    </button>
                </div>

                <form onsubmit="handleSave(event)" class="space-y-3 text-xs">
                    <div>
                        <label class="block text-gray-300 font-medium mb-1">N° conteneur</label>
                        <input type="text" id="inpId" required placeholder="MSCU1234567" class="w-full input-dark p-2.5 rounded-xl uppercase font-bold">
                    </div>

                    <div>
                        <label class="block text-gray-300 font-medium mb-1">Type & taille</label>
                        <select id="inpType" required class="w-full input-dark p-2.5 rounded-xl">
                            <option value="">Choisir...</option>
                            <option value="20' ST">20' ST</option>
                            <option value="40' HC">40' HC</option>
                            <option value="40' RF">40' RF</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-gray-300 font-medium mb-1">Emplacement</label>
                        <input type="text" id="inpLoc" required placeholder="B01-R04-T2" class="w-full input-dark p-2.5 rounded-xl uppercase">
                    </div>

                    <div>
                        <label class="block text-gray-300 font-medium mb-1">État</label>
                        <select id="inpStatus" class="w-full input-dark p-2.5 rounded-xl">
                            <option value="Bon état">Bon état</option>
                            <option value="Endommagé">Endommagé</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-gray-300 font-medium mb-1">N° plomb</label>
                        <input type="text" id="inpSeal" placeholder="SL-00000" class="w-full input-dark p-2.5 rounded-xl uppercase">
                    </div>

                    <div>
                        <label class="block text-gray-300 font-medium mb-1">Vacation</label>
                        <select id="inpShift" class="w-full input-dark p-2.5 rounded-xl">
                            <option value="Vacation 1">Vacation 1</option>
                            <option value="Vacation 2">Vacation 2</option>
                            <option value="Vacation 3">Vacation 3</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-gray-300 font-medium mb-1">Remarques</label>
                        <textarea id="inpNotes" rows="2" placeholder="Porte déformée, frigo OK..." class="w-full input-dark p-2.5 rounded-xl"></textarea>
                    </div>

                    <div class="flex items-center gap-3 pt-2">
                        <button type="button" onclick="closeModal()" class="w-1/2 bg-[#2c2c2e] text-white font-bold py-2.5 rounded-xl text-xs">Annuler</button>
                        <button type="submit" class="w-1/2 btn-orange font-bold py-2.5 rounded-xl text-xs shadow-lg">Enregistrer</button>
                    </div>
                </form>
            </div>
        </div>

    </div>

    <script>
        let containers = [
            { id: 'SUDU5544332', type: "40' RF", loc: 'C05-R01-T3', seal: 'SL-77610', shift: 'Vacation 1', time: '11:00', status: 'Bon état', notes: 'Conteneur Frigo OK' },
            { id: 'CMAU9876543', type: "20' ST", loc: 'A02-R10-T1', seal: 'SL-33412', shift: 'Vacation 1', time: '10:15', status: 'Endommagé', notes: 'Porte déformée' },
            { id: 'MSCU1234567', type: "40' HC", loc: 'B01-R04-T2', seal: 'SL-99821', shift: 'Vacation 1', time: '09:30', status: 'Bon état', notes: 'RAS' }
        ];

        function renderList(data = containers) {
            const listEl = document.getElementById('containersList');
            document.getElementById('containerCount').innerText = `${data.length} conteneurs`;
            listEl.innerHTML = '';

            data.forEach((item) => {
                const isGood = item.status === 'Bon état';
                const badgeClass = isGood ? 'badge-green' : 'badge-red';

                const card = document.createElement('div');
                card.className = "card-dark p-3.5 rounded-2xl space-y-1.5 text-xs mb-2";
                card.innerHTML = `
                    <div class="flex items-center justify-between">
                        <h4 class="font-extrabold text-sm tracking-wider text-white">${item.id}</h4>
                        <span class="px-2.5 py-0.5 rounded-full font-bold text-[10px] ${badgeClass}">${item.status}</span>
                    </div>
                    <p class="text-gray-400 font-medium">${item.type} • ${item.loc}</p>
                    <div class="flex items-center gap-3 text-gray-400 text-[11px] pt-1">
                        <span>Plomb ${item.seal}</span>
                        <span>${item.shift}</span>
                        <span>${item.time}</span>
                    </div>
                    ${item.notes ? `<p class="text-gray-300 font-medium pt-0.5">${item.notes}</p>` : ''}
                `;
                listEl.appendChild(card);
            });
        }

        function filterContainers() {
            const val = document.getElementById('filterStatus').value;
            if (val === 'All') renderList(containers);
            else renderList(containers.filter(c => c.status === val));
        }

        function openModal() { document.getElementById('modalOverlay').classList.remove('hidden'); }
        function closeModal() { document.getElementById('modalOverlay').classList.add('hidden'); }

        function handleSave(e) {
            e.preventDefault();
            const now = new Date();
            const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;

            const newItem = {
                id: document.getElementById('inpId').value.toUpperCase(),
                type: document.getElementById('inpType').value,
                loc: document.getElementById('inpLoc').value.toUpperCase(),
                status: document.getElementById('inpStatus').value,
                seal: document.getElementById('inpSeal').value.toUpperCase() || 'SL-00000',
                shift: document.getElementById('inpShift').value,
                notes: document.getElementById('inpNotes').value || 'RAS',
                time: timeStr
            };

            containers.unshift(newItem);
            renderList();
            closeModal();
            
            document.getElementById('inpId').value = '';
            document.getElementById('inpLoc').value = '';
            document.getElementById('inpSeal').value = '';
            document.getElementById('inpNotes').value = '';
        }

        renderList();
    </script>
</body>
</html>
EOF
