<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pointeur conteneurs - DP World</title>
    <!-- Tailwind CSS & SheetJS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #070e17; 
            color: #ffffff; 
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }
        .dpw-card { background-color: #0d1b2a; border: 1px solid #1b2e4b; }
        .input-dpw { background-color: #132337; border: 1px solid #233a5e; color: #ffffff; }
        .input-dpw:focus { border-color: #ff5e1e; outline: none; }
        .btn-dpw-orange { background-color: #ff5e1e; color: white; }
        .btn-dpw-orange:hover { background-color: #e04e15; }
        .btn-dpw-blue { background-color: #0066cc; color: white; }
        .btn-dpw-blue:hover { background-color: #0052a3; }
        .btn-green { background-color: #10b981; color: white; }
        .btn-green:hover { background-color: #059669; }
        .badge-green { background-color: #064e3b; color: #34d399; border: 1px solid #047857; }
        .badge-red { background-color: #4c0519; color: #fb7185; border: 1px solid #9f1239; }
        .badge-dpw { background-color: #1e3a8a; color: #93c5fd; border: 1px solid #2563eb; }
        .nav-item-active { color: #ff5e1e; }
        .nav-item-inactive { color: #64748b; }
    </style>
</head>
<body class="bg-[#070e17] min-h-screen flex flex-col justify-between antialiased selection:bg-orange-500 pb-20">

    <!-- Container Main Area -->
    <div class="w-full p-4 sm:p-6 max-w-lg mx-auto">

        <!-- DP WORLD BRAND HEADER SECTION -->
        <div class="flex items-center justify-between mt-2 mb-5 pb-3 border-b border-[#1b2e4b]">
            <div class="flex items-center gap-3">
                <!-- DP World Official Vector Logo -->
                <div class="bg-white p-2 rounded-xl shadow-md flex items-center justify-center">
                    <svg class="h-7 w-auto" viewBox="0 0 200 45" fill="none" xmlns="http://www.w3.org/2000/svg">
                        <path d="M12.5 10H0V35H12.5C19.4 35 25 29.4 25 22.5C25 15.6 19.4 10 12.5 10ZM12.5 28H7V17H12.5C15.5 17 18 19.5 18 22.5C18 25.5 15.5 28 12.5 28Z" fill="#0D1B2A"/>
                        <path d="M32 10H27V35H32V26H38C42.4 26 46 22.4 46 18C46 13.6 42.4 10 38 10H32ZM38 19.5H32V16.5H38C38.8 16.5 39.5 17.2 39.5 18C39.5 18.8 38.8 19.5 38 19.5Z" fill="#0D1B2A"/>
                        <path d="M62 10L56.5 35H62.5L65.5 21L68.5 35H74.5L69 10H62Z" fill="#FF5E1E"/>
                        <path d="M85 10C78.1 10 72.5 15.6 72.5 22.5C72.5 29.4 78.1 35 85 35C91.9 35 97.5 29.4 97.5 22.5C97.5 15.6 91.9 10 85 10ZM85 28C81.9 28 79.5 25.5 79.5 22.5C79.5 19.5 81.9 17 85 17C88.1 17 90.5 19.5 90.5 22.5C90.5 25.5 88.1 28 85 28Z" fill="#0D1B2A"/>
                        <path d="M102 10V35H108V10H102Z" fill="#0D1B2A"/>
                        <path d="M115 10V35H128V28H121V10H115Z" fill="#0D1B2A"/>
                        <path d="M133 10V35H144C151 35 156.5 29.4 156.5 22.5C156.5 15.6 151 10 144 10H133ZM144 28H139V17H144C147 17 149.5 19.5 149.5 22.5C149.5 25.5 147 28 144 28Z" fill="#0D1B2A"/>
                    </svg>
                </div>
                <div>
                    <h1 class="font-extrabold text-lg leading-tight tracking-wide text-white">Pointeur Conteneurs</h1>
                    <p class="text-[11px] text-gray-400 font-semibold tracking-wider uppercase">Djendjen Port Terminal</p>
                </div>
            </div>
            
            <div class="flex items-center gap-2">
                <button onclick="exportToExcel()" class="btn-green px-3 py-2.5 rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-md active:scale-95 transition" title="Exporter Excel">
                    <i class="fa-solid fa-file-excel text-sm"></i>
                    <span>Excel</span>
                </button>
                <button onclick="openModal()" class="btn-dpw-orange px-3.5 py-2.5 rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-md active:scale-95 transition">
                    <i class="fa-solid fa-plus"></i>
                    <span>+ Pointer</span>
                </button>
            </div>
        </div>

        <!-- TAB 1: ACCUEIL -->
        <div id="tabAccueil" class="space-y-4">
            <div class="flex items-center justify-between my-2 text-xs gap-2">
                <select id="filterStatus" onchange="filterContainers()" class="input-dpw px-3 py-2.5 rounded-xl font-medium outline-none w-1/2">
                    <option value="All">Tous les états</option>
                    <option value="Bon état">Bon état</option>
                    <option value="Endommagé">Endommagé</option>
                </select>
                <span id="containerCount" class="text-gray-400 font-semibold text-right w-1/2">0 conteneur</span>
            </div>

            <!-- Containers Dynamic List -->
            <div id="containersList" class="space-y-3"></div>
        </div>

        <!-- TAB 2: CONFIGURATION DES MODÈLES DE TABLEAU -->
        <div id="tabSettings" class="hidden space-y-4">
            <div class="dpw-card p-4 rounded-2xl space-y-3">
                <h3 class="font-bold text-sm text-white flex items-center gap-2">
                    <i class="fa-solid fa-table-columns text-[#ff5e1e]"></i>
                    <span>Créer un Modèle de Tableau</span>
                </h3>
                <p class="text-xs text-gray-400">Ajoutez un modèle d'opération et définissez les colonnes/champs spécifiques.</p>
                
                <div class="flex items-center gap-2 pt-1">
                    <input type="text" id="inpNewModel" placeholder="Nom du modèle (ex: Visite Douane)" class="input-dpw p-2.5 rounded-xl text-xs flex-1">
                    <button onclick="addNewModel()" class="btn-dpw-orange px-4 py-2.5 rounded-xl text-xs font-bold active:scale-95 transition">
                        Créer
                    </button>
                </div>
            </div>

            <!-- Active Models & Custom Fields -->
            <div class="dpw-card p-4 rounded-2xl space-y-4">
                <h4 class="font-semibold text-xs text-gray-300">Modèles configurés & Colonnes</h4>
                <div id="modelsList" class="space-y-3"></div>
            </div>
        </div>

    </div>

    <!-- BOTTOM NAVIGATION BAR -->
    <div class="fixed bottom-0 left-0 right-0 bg-[#0d1b2a]/95 backdrop-blur-md border-t border-[#1b2e4b] z-40 max-w-lg mx-auto">
        <div class="flex items-center justify-around py-2.5 px-4 text-center">
            <button id="navBtnAccueil" onclick="switchTab('accueil')" class="flex flex-col items-center gap-1 nav-item-active transition">
                <i class="fa-solid fa-house text-lg"></i>
                <span class="text-[10px] font-semibold">Accueil</span>
            </button>
            <button id="navBtnSettings" onclick="switchTab('settings')" class="flex flex-col items-center gap-1 nav-item-inactive transition">
                <i class="fa-solid fa-sliders text-lg"></i>
                <span class="text-[10px] font-semibold">Modèles</span>
            </button>
        </div>
    </div>

    <!-- POPUP MODAL (Pointer un conteneur) -->
    <div id="modalOverlay" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center">
        <div class="w-full max-w-lg bg-[#0d1b2a] rounded-t-[28px] sm:rounded-[28px] p-5 border border-[#1b2e4b] shadow-2xl max-h-[90vh] overflow-y-auto">
            
            <div class="flex items-center justify-between mb-4 border-b border-[#1b2e4b] pb-3">
                <h3 class="font-bold text-base text-center w-full">Pointer un conteneur</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white text-lg p-1">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form onsubmit="handleSave(event)" class="space-y-3.5 text-xs">
                <div>
                    <label class="block text-gray-300 font-medium mb-1">Modèle de pointeage</label>
                    <select id="inpModel" onchange="updateDynamicFormFields()" required class="w-full input-dpw p-3 rounded-xl font-bold text-[#ff5e1e] bg-[#132337]"></select>
                </div>

                <div>
                    <label class="block text-gray-300 font-medium mb-1">N° conteneur</label>
                    <input type="text" id="inpId" required placeholder="MSCU1234567" class="w-full input-dpw p-3 rounded-xl uppercase font-bold tracking-wider text-sm">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-gray-300 font-medium mb-1">Type & taille</label>
                        <select id="inpType" required class="w-full input-dpw p-3 rounded-xl">
                            <option value="20' ST">20' ST</option>
                            <option value="40' HC">40' HC</option>
                            <option value="40' RF">40' RF</option>
                            <option value="45' HC">45' HC</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-gray-300 font-medium mb-1">État</label>
                        <select id="inpStatus" class="w-full input-dpw p-3 rounded-xl">
                            <option value="Bon état">Bon état</option>
                            <option value="Endommagé">Endommagé</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-gray-300 font-medium mb-1">Emplacement</label>
                        <input type="text" id="inpLoc" required placeholder="B01-R04-T2" class="w-full input-dpw p-3 rounded-xl uppercase">
                    </div>
                    <div>
                        <label class="block text-gray-300 font-medium mb-1">N° plomb</label>
                        <input type="text" id="inpSeal" placeholder="SL-00000" class="w-full input-dpw p-3 rounded-xl uppercase">
                    </div>
                </div>

                <!-- DYNAMIC CUSTOM FIELDS FOR THE SELECTED MODEL -->
                <div id="dynamicFieldsContainer" class="space-y-3 pt-2 border-t border-[#1b2e4b]"></div>

                <div>
                    <label class="block text-gray-300 font-medium mb-1">Remarques générales</label>
                    <textarea id="inpNotes" rows="2" placeholder="Informations complémentaires..." class="w-full input-dpw p-3 rounded-xl"></textarea>
                </div>

                <div class="flex items-center gap-3 pt-2">
                    <button type="button" onclick="closeModal()" class="w-1/2 bg-[#1b2e4b] hover:bg-gray-700 text-white font-bold py-3 rounded-xl text-xs">Annuler</button>
                    <button type="submit" class="w-1/2 btn-dpw-orange font-bold py-3 rounded-xl text-xs shadow-lg">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        let containers = JSON.parse(localStorage.getItem('dpw_containers')) || [];
        let modelConfigs = JSON.parse(localStorage.getItem('dpw_model_configs')) || {
            'Débarquement': ['Navire', 'N° Manifeste', 'Température'],
            'Visite Douane': ['Nom Douanier', 'N° Déclaration', 'Résultat Visite'],
            'Embarquement': ['Destination', 'Poids (Tonnes)']
        };

        function saveContainers() { localStorage.setItem('dpw_containers', JSON.stringify(containers)); }
        function saveModelConfigs() { localStorage.setItem('dpw_model_configs', JSON.stringify(modelConfigs)); }

        function switchTab(tabName) {
            const accueilTab = document.getElementById('tabAccueil');
            const settingsTab = document.getElementById('tabSettings');
            const btnAccueil = document.getElementById('navBtnAccueil');
            const btnSettings = document.getElementById('navBtnSettings');

            if (tabName === 'accueil') {
                accueilTab.classList.remove('hidden');
                settingsTab.classList.add('hidden');
                btnAccueil.className = "flex flex-col items-center gap-1 nav-item-active transition";
                btnSettings.className = "flex flex-col items-center gap-1 nav-item-inactive transition";
            } else {
                accueilTab.classList.add('hidden');
                settingsTab.classList.remove('hidden');
                btnAccueil.className = "flex flex-col items-center gap-1 nav-item-inactive transition";
                btnSettings.className = "flex flex-col items-center gap-1 nav-item-active transition";
                renderModelsList();
            }
        }

        function populateModelSelect() {
            const selectEl = document.getElementById('inpModel');
            selectEl.innerHTML = '';
            Object.keys(modelConfigs).forEach(m => {
                const opt = document.createElement('option');
                opt.value = m;
                opt.innerText = m;
                selectEl.appendChild(opt);
            });
            updateDynamicFormFields();
        }

        function updateDynamicFormFields() {
            const currentModel = document.getElementById('inpModel').value;
            const container = document.getElementById('dynamicFieldsContainer');
            container.innerHTML = '';

            const fields = modelConfigs[currentModel] || [];
            if (fields.length > 0) {
                const title = document.createElement('p');
                title.className = "text-[11px] font-bold text-[#ff5e1e] uppercase tracking-wider mb-2";
                title.innerText = `Champs spécifiques (${currentModel})`;
                container.appendChild(title);

                fields.forEach(fName => {
                    const div = document.createElement('div');
                    div.className = "mb-2";
                    div.innerHTML = `
                        <label class="block text-gray-300 font-medium mb-1">${fName}</label>
                        <input type="text" data-custom-field="${fName}" placeholder="Renseigner ${fName}..." class="w-full input-dpw p-2.5 rounded-xl text-xs">
                    `;
                    container.appendChild(div);
                });
            }
        }

        function renderModelsList() {
            const listEl = document.getElementById('modelsList');
            listEl.innerHTML = '';
            
            Object.keys(modelConfigs).forEach(mName => {
                const fields = modelConfigs[mName];
                const card = document.createElement('div');
                card.className = "bg-[#132337] p-3 rounded-xl text-xs space-y-2 border border-[#233a5e]";
                
                card.innerHTML = `
                    <div class="flex items-center justify-between">
                        <span class="font-bold text-white text-sm">${mName}</span>
                        <button onclick="deleteModel('${mName}')" class="text-gray-400 hover:text-red-400 p-1"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                    <div class="flex flex-wrap gap-1.5 pt-1">
                        ${fields.map(f => `<span class="bg-[#0d1b2a] text-gray-300 px-2 py-0.5 rounded-md border border-[#1b2e4b] text-[10px]">${f}</span>`).join('')}
                    </div>
                    <div class="flex items-center gap-2 pt-2">
                        <input type="text" id="addField_${mName.replace(/\s+/g, '')}" placeholder="Ajouter une colonne (ex: Navire)" class="input-dpw p-2 rounded-lg text-xs flex-1">
                        <button onclick="addFieldToModel('${mName}')" class="btn-dpw-blue px-3 py-2 rounded-lg text-xs font-bold">+ Champ</button>
                    </div>
                `;
                listEl.appendChild(card);
            });
        }

        function addNewModel() {
            const val = document.getElementById('inpNewModel').value.trim();
            if (val && !modelConfigs[val]) {
                modelConfigs[val] = [];
                saveModelConfigs();
                document.getElementById('inpNewModel').value = '';
                renderModelsList();
                populateModelSelect();
            }
        }

        function addFieldToModel(modelName) {
            const inputId = `addField_${modelName.replace(/\s+/g, '')}`;
            const fieldName = document.getElementById(inputId).value.trim();
            if (fieldName && !modelConfigs[modelName].includes(fieldName)) {
                modelConfigs[modelName].push(fieldName);
                saveModelConfigs();
                renderModelsList();
            }
        }

        function deleteModel(modelName) {
            if (confirm(`Voulez-vous vraiment supprimer le modèle "${modelName}" ?`)) {
                delete modelConfigs[modelName];
                saveModelConfigs();
                renderModelsList();
                populateModelSelect();
            }
        }

        function renderList(data = containers) {
            const listEl = document.getElementById('containersList');
            document.getElementById('containerCount').innerText = `${data.length} conteneur${data.length > 1 ? 's' : ''}`;
            listEl.innerHTML = '';

            if (data.length === 0) {
                listEl.innerHTML = `
                    <div class="text-center py-12 text-gray-500 font-medium text-xs">
                        <i class="fa-solid fa-box-open text-3xl mb-2 block text-gray-600"></i>
                        Aucun conteneur pointé pour le moment.
                    </div>
                `;
                return;
            }

            data.forEach((item, index) => {
                const isGood = item.status === 'Bon état';
                const badgeClass = isGood ? 'badge-green' : 'badge-red';

                let customFieldsHTML = '';
                if (item.customData && Object.keys(item.customData).length > 0) {
                    customFieldsHTML = `<div class="flex flex-wrap gap-2 pt-1 text-[11px] text-gray-300">`;
                    for (const [key, val] of Object.entries(item.customData)) {
                        if (val) customFieldsHTML += `<span class="bg-[#132337] px-2 py-0.5 rounded border border-[#233a5e]"><b>${key}:</b> ${val}</span>`;
                    }
                    customFieldsHTML += `</div>`;
                }

                const card = document.createElement('div');
                card.className = "dpw-card p-4 rounded-2xl space-y-2 text-xs mb-3 shadow-sm relative";
                card.innerHTML = `
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <h4 class="font-extrabold text-base tracking-wider text-white">${item.id}</h4>
                            <span class="px-2 py-0.5 rounded-md font-semibold text-[10px] badge-dpw">${item.model}</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="px-2.5 py-1 rounded-full font-bold text-[11px] ${badgeClass}">${item.status}</span>
                            <button onclick="deleteContainer(${index})" class="text-gray-500 hover:text-red-400 p-1.5 transition"><i class="fa-solid fa-trash-can text-sm"></i></button>
                        </div>
                    </div>
                    <p class="text-gray-400 font-medium text-xs">${item.type} • ${item.loc} • Plomb: ${item.seal}</p>
                    ${customFieldsHTML}
                    <div class="flex items-center gap-3 text-gray-400 text-[11px] pt-1 border-t border-[#1b2e4b]">
                        <span>${item.time}</span>
                        <span>•</span>
                        <span>${item.date}</span>
                    </div>
                `;
                listEl.appendChild(card);
            });
        }

        function filterContainers() {
            const val = document.getElementById('filterStatus').value;
            if (val === 'All') renderList(containers);
            else renderList(containers.filter(c => c.status === val));
        }

        function openModal() { 
            populateModelSelect();
            document.getElementById('modalOverlay').classList.remove('hidden'); 
        }
        function closeModal() { document.getElementById('modalOverlay').classList.add('hidden'); }

        function deleteContainer(index) {
            if (confirm("Voulez-vous vraiment supprimer ce conteneur ?")) {
                containers.splice(index, 1);
                saveContainers();
                renderList();
            }
        }

        function handleSave(e) {
            e.preventDefault();
            const now = new Date();
            const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            const selectedModel = document.getElementById('inpModel').value;

            const customData = {};
            const customInputs = document.querySelectorAll('[data-custom-field]');
            customInputs.forEach(input => {
                const fieldName = input.getAttribute('data-custom-field');
                customData[fieldName] = input.value || '-';
            });

            const newItem = {
                id: document.getElementById('inpId').value.toUpperCase(),
                model: selectedModel,
                type: document.getElementById('inpType').value,
                loc: document.getElementById('inpLoc').value.toUpperCase(),
                status: document.getElementById('inpStatus').value,
                seal: document.getElementById('inpSeal').value.toUpperCase() || 'SL-00000',
                notes: document.getElementById('inpNotes').value || 'RAS',
                customData: customData,
                time: timeStr,
                date: now.toLocaleDateString('fr-FR')
            };

            containers.unshift(newItem);
            saveContainers();
            renderList();
            closeModal();
            
            document.getElementById('inpId').value = '';
            document.getElementById('inpLoc').value = '';
            document.getElementById('inpSeal').value = '';
            document.getElementById('inpNotes').value = '';
        }

        function exportToExcel() {
            if (containers.length === 0) {
                alert("Aucun conteneur à exporter.");
                return;
            }

            const workbook = XLSX.utils.book_new();

            Object.keys(modelConfigs).forEach(mName => {
                const filtered = containers.filter(c => c.model === mName);
                if (filtered.length > 0) {
                    const modelData = filtered.map(c => {
                        let rowObj = {
                            "Date": c.date,
                            "Heure": c.time,
                            "N° Conteneur": c.id,
                            "Type & Taille": c.type,
                            "Emplacement": c.loc,
                            "État": c.status,
                            "N° Plomb": c.seal
                        };

                        if (c.customData) {
                            for (const [k, v] of Object.entries(c.customData)) {
                                rowObj[k] = v;
                            }
                        }

                        rowObj["Remarques"] = c.notes;
                        return rowObj;
                    });

                    const wsModel = XLSX.utils.json_to_sheet(modelData);
                    XLSX.utils.book_append_sheet(workbook, wsModel, mName.substring(0, 30));
                }
            });

            const fileName = `Pointeur_DPW_${new Date().toISOString().slice(0, 10)}.xlsx`;
            XLSX.writeFile(workbook, fileName);
        }

        populateModelSelect();
        renderList();
    </script>
</body>
</html>
