<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pointeur conteneurs - DP World</title>
    <!-- Tailwind CSS & Icons & SheetJS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-color: #121212; 
            color: #ffffff; 
            margin: 0;
            padding: 0;
            min-height: 100vh;
        }
        .card-dark { background-color: #1a1a1a; border: 1px solid #2a2a2a; }
        .input-dark { background-color: #262626; border: 1px solid #333333; color: #ffffff; }
        .input-dark:focus { border-color: #ff3b30; outline: none; }
        .btn-orange { background-color: #ff3b30; color: white; }
        .btn-orange:hover { background-color: #e03228; }
        .btn-green { background-color: #34c759; color: white; }
        .btn-green:hover { background-color: #2fb04f; }
        .btn-blue { background-color: #007aff; color: white; }
        .badge-green { background-color: #1a382b; color: #34c759; border: 1px solid #24523b; }
        .badge-red { background-color: #381a1a; color: #ff453a; border: 1px solid #522424; }
        .badge-blue { background-color: #1a2b38; color: #3897ff; border: 1px solid #243e52; }
        .nav-item-active { color: #ff3b30; }
        .nav-item-inactive { color: #8e8e93; }
    </style>
</head>
<body class="bg-[#121212] min-h-screen flex flex-col justify-between antialiased selection:bg-red-500 pb-20">

    <!-- Container Main Area -->
    <div class="w-full p-4 sm:p-6 max-w-lg mx-auto">

        <!-- Header Section -->
        <div class="flex items-center justify-between mt-2 mb-4">
            <div class="flex items-center gap-3">
                <div class="w-11 h-11 bg-[#ff3b30] rounded-2xl flex items-center justify-center text-white text-xl shadow-lg">
                    <i class="fa-solid fa-box font-bold"></i>
                </div>
                <div>
                    <h1 class="font-bold text-xl leading-tight">Pointeur<br>conteneurs</h1>
                    <p class="text-xs text-gray-400 font-medium">DP World Djendjen</p>
                </div>
            </div>
            
            <div class="flex items-center gap-2">
                <button onclick="exportToExcel()" class="btn-green px-3 py-2.5 rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-md active:scale-95 transition" title="Télécharger Excel">
                    <i class="fa-solid fa-file-excel text-sm"></i>
                    <span>Excel</span>
                </button>
                <button onclick="openModal()" class="btn-orange px-3.5 py-2.5 rounded-xl text-xs font-bold flex items-center gap-1.5 shadow-md active:scale-95 transition">
                    <i class="fa-solid fa-plus"></i>
                    <span>+ Pointer</span>
                </button>
            </div>
        </div>

        <!-- TAB 1: SECTION ACCUEIL -->
        <div id="tabAccueil" class="space-y-4">
            <div class="flex items-center justify-between my-2 text-xs gap-2">
                <select id="filterStatus" onchange="filterContainers()" class="input-dark px-3 py-2.5 rounded-xl font-medium outline-none w-1/2">
                    <option value="All">Tous les états</option>
                    <option value="Bon état">Bon état</option>
                    <option value="Endommagé">Endommagé</option>
                </select>
                <span id="containerCount" class="text-gray-400 font-semibold text-right w-1/2">0 conteneur</span>
            </div>

            <!-- Containers Dynamic List -->
            <div id="containersList" class="space-y-3"></div>
        </div>

        <!-- TAB 2: SECTION CONFIGURATION DES MODÈLES (إدارة نماذج الجدول) -->
        <div id="tabSettings" class="hidden space-y-4">
            <div class="card-dark p-4 rounded-2xl space-y-3">
                <h3 class="font-bold text-sm text-white flex items-center gap-2">
                    <i class="fa-solid fa-table-columns text-[#ff3b30]"></i>
                    <span>Créer un Modèle de Tableau</span>
                </h3>
                <p class="text-xs text-gray-400">Ajoutez un nouveau modèle et définissez les colonnes/champs spécifiques à remplir.</p>
                
                <div class="flex items-center gap-2 pt-1">
                    <input type="text" id="inpNewModel" placeholder="Nom du modèle (ex: Visite Douane)" class="input-dark p-2.5 rounded-xl text-xs flex-1">
                    <button onclick="addNewModel()" class="btn-orange px-4 py-2.5 rounded-xl text-xs font-bold active:scale-95 transition">
                        Créer
                    </button>
                </div>
            </div>

            <!-- Active Models & Custom Fields -->
            <div class="card-dark p-4 rounded-2xl space-y-4">
                <h4 class="font-semibold text-xs text-gray-300">Modèles configurés & Colonnes</h4>
                <div id="modelsList" class="space-y-3"></div>
            </div>
        </div>

    </div>

    <!-- BOTTOM NAVIGATION BAR -->
    <div class="fixed bottom-0 left-0 right-0 bg-[#1c1c1e]/95 backdrop-blur-md border-t border-[#2c2c2e] z-40 max-w-lg mx-auto">
        <div class="flex items-center justify-around py-2.5 px-4 text-center">
            <button id="navBtnAccueil" onclick="switchTab('accueil')" class="flex flex-col items-center gap-1 nav-item-active transition">
                <i class="fa-solid fa-house text-lg"></i>
                <span class="text-[10px] font-semibold">Accueil</span>
            </button>
            <button id="navBtnSettings" onclick="switchTab('settings')" class="flex flex-col items-center gap-1 nav-item-inactive transition">
                <i class="fa-solid fa-sliders text-lg"></i>
                <span class="text-[10px] font-semibold">Modèles</span>
            </button>
        </div>
    </div>

    <!-- POPUP MODAL (Pointer un conteneur) -->
    <div id="modalOverlay" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-end sm:items-center justify-center">
        <div class="w-full max-w-lg bg-[#1c1c1e] rounded-t-[28px] sm:rounded-[28px] p-5 border border-[#2c2c2e] shadow-2xl max-h-[90vh] overflow-y-auto">
            
            <div class="flex items-center justify-between mb-4 border-b border-gray-800 pb-3">
                <h3 class="font-bold text-base text-center w-full">Pointer un conteneur</h3>
                <button onclick="closeModal()" class="text-gray-400 hover:text-white text-lg p-1">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <form onsubmit="handleSave(event)" class="space-y-3.5 text-xs">
                <div>
                    <label class="block text-gray-300 font-medium mb-1">Modèle de pointeage</label>
                    <select id="inpModel" onchange="updateDynamicFormFields()" required class="w-full input-dark p-3 rounded-xl font-bold text-[#ff3b30] bg-[#222]"></select>
                </div>

                <div>
                    <label class="block text-gray-300 font-medium mb-1">N° conteneur</label>
                    <input type="text" id="inpId" required placeholder="MSCU1234567" class="w-full input-dark p-3 rounded-xl uppercase font-bold tracking-wider text-sm">
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-gray-300 font-medium mb-1">Type & taille</label>
                        <select id="inpType" required class="w-full input-dark p-3 rounded-xl">
                            <option value="20' ST">20' ST</option>
                            <option value="40' HC">40' HC</option>
                            <option value="40' RF">40' RF</option>
                            <option value="45' HC">45' HC</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-gray-300 font-medium mb-1">État</label>
                        <select id="inpStatus" class="w-full input-dark p-3 rounded-xl">
                            <option value="Bon état">Bon état</option>
                            <option value="Endommagé">Endommagé</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="block text-gray-300 font-medium mb-1">Emplacement</label>
                        <input type="text" id="inpLoc" required placeholder="B01-R04-T2" class="w-full input-dark p-3 rounded-xl uppercase">
                    </div>
                    <div>
                        <label class="block text-gray-300 font-medium mb-1">N° plomb</label>
                        <input type="text" id="inpSeal" placeholder="SL-00000" class="w-full input-dark p-3 rounded-xl uppercase">
                    </div>
                </div>

                <!-- DYNAMIC CUSTOM FIELDS FOR THE SELECTED MODEL (حقول إضافية حسب النموذج) -->
                <div id="dynamicFieldsContainer" class="space-y-3 pt-2 border-t border-gray-800"></div>

                <div>
                    <label class="block text-gray-300 font-medium mb-1">Remarques générales</label>
                    <textarea id="inpNotes" rows="2" placeholder="Informations complémentaires..." class="w-full input-dark p-3 rounded-xl"></textarea>
                </div>

                <div class="flex items-center gap-3 pt-2">
                    <button type="button" onclick="closeModal()" class="w-1/2 bg-[#2c2c2e] hover:bg-gray-700 text-white font-bold py-3 rounded-xl text-xs">Annuler</button>
                    <button type="submit" class="w-1/2 btn-orange font-bold py-3 rounded-xl text-xs shadow-lg">Enregistrer</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Application Script -->
    <script>
        let containers = JSON.parse(localStorage.getItem('dpw_containers')) || [];
        // Structure: { 'ModelName': ['Field1', 'Field2'] }
        let modelConfigs = JSON.parse(localStorage.getItem('dpw_model_configs')) || {
            'Débarquement': ['Navire', 'N° Manifeste', 'Température'],
            'Visite Douane': ['Nom Douanier', 'N° Déclaration', 'Résultat Visite'],
            'Embarquement': ['Destination', 'Poids (Tonnes)']
        };

        function saveContainers() { localStorage.setItem('dpw_containers', JSON.stringify(containers)); }
        function saveModelConfigs() { localStorage.setItem('dpw_model_configs', JSON.stringify(modelConfigs)); }

        function switchTab(tabName) {
            const accueilTab = document.getElementById('tabAccueil');
            const settingsTab = document.getElementById('tabSettings');
            const btnAccueil = document.getElementById('navBtnAccueil');
            const btnSettings = document.getElementById('navBtnSettings');

            if (tabName === 'accueil') {
                accueilTab.classList.remove('hidden');
                settingsTab.classList.add('hidden');
                btnAccueil.className = "flex flex-col items-center gap-1 nav-item-active transition";
                btnSettings.className = "flex flex-col items-center gap-1 nav-item-inactive transition";
            } else {
                accueilTab.classList.add('hidden');
                settingsTab.classList.remove('hidden');
                btnAccueil.className = "flex flex-col items-center gap-1 nav-item-inactive transition";
                btnSettings.className = "flex flex-col items-center gap-1 nav-item-active transition";
                renderModelsList();
            }
        }

        function populateModelSelect() {
            const selectEl = document.getElementById('inpModel');
            selectEl.innerHTML = '';
            Object.keys(modelConfigs).forEach(m => {
                const opt = document.createElement('option');
                opt.value = m;
                opt.innerText = m;
                selectEl.appendChild(opt);
            });
            updateDynamicFormFields();
        }

        function updateDynamicFormFields() {
            const currentModel = document.getElementById('inpModel').value;
            const container = document.getElementById('dynamicFieldsContainer');
            container.innerHTML = '';

            const fields = modelConfigs[currentModel] || [];
            if (fields.length > 0) {
                const title = document.createElement('p');
                title.className = "text-[11px] font-bold text-[#ff3b30] uppercase tracking-wider mb-2";
                title.innerText = `Champs spécifiques (${currentModel})`;
                container.appendChild(title);

                fields.forEach(fName => {
                    const div = document.createElement('div');
                    div.className = "mb-2";
                    div.innerHTML = `
                        <label class="block text-gray-300 font-medium mb-1">${fName}</label>
                        <input type="text" data-custom-field="${fName}" placeholder="Renseigner ${fName}..." class="w-full input-dark p-2.5 rounded-xl text-xs">
                    `;
                    container.appendChild(div);
                });
            }
        }

        function renderModelsList() {
            const listEl = document.getElementById('modelsList');
            listEl.innerHTML = '';
            
            Object.keys(modelConfigs).forEach(mName => {
                const fields = modelConfigs[mName];
                const card = document.createElement('div');
                card.className = "bg-[#262626] p-3 rounded-xl text-xs space-y-2 border border-gray-800";
                
                card.innerHTML = `
                    <div class="flex items-center justify-between">
                        <span class="font-bold text-white text-sm">${mName}</span>
                        <button onclick="deleteModel('${mName}')" class="text-gray-500 hover:text-red-500 p-1"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                    <div class="flex flex-wrap gap-1.5 pt-1">
                        ${fields.map(f => `<span class="bg-[#1c1c1e] text-gray-300 px-2 py-0.5 rounded-md border border-gray-700 text-[10px]">${f}</span>`).join('')}
                    </div>
                    <div class="flex items-center gap-2 pt-2">
                        <input type="text" id="addField_${mName.replace(/\s+/g, '')}" placeholder="Ajouter une colonne (ex: Navire)" class="input-dark p-2 rounded-lg text-xs flex-1">
                        <button onclick="addFieldToModel('${mName}')" class="btn-blue px-3 py-2 rounded-lg text-xs font-bold">+ Champ</button>
                    </div>
                `;
                listEl.appendChild(card);
            });
        }

        function addNewModel() {
            const val = document.getElementById('inpNewModel').value.trim();
            if (val && !modelConfigs[val]) {
                modelConfigs[val] = [];
                saveModelConfigs();
                document.getElementById('inpNewModel').value = '';
                renderModelsList();
                populateModelSelect();
            }
        }

        function addFieldToModel(modelName) {
            const inputId = `addField_${modelName.replace(/\s+/g, '')}`;
            const fieldName = document.getElementById(inputId).value.trim();
            if (fieldName && !modelConfigs[modelName].includes(fieldName)) {
                modelConfigs[modelName].push(fieldName);
                saveModelConfigs();
                renderModelsList();
            }
        }

        function deleteModel(modelName) {
            if (confirm(`Voulez-vous vraiment supprimer le modèle "${modelName}" ?`)) {
                delete modelConfigs[modelName];
                saveModelConfigs();
                renderModelsList();
                populateModelSelect();
            }
        }

        function renderList(data = containers) {
            const listEl = document.getElementById('containersList');
            document.getElementById('containerCount').innerText = `${data.length} conteneur${data.length > 1 ? 's' : ''}`;
            listEl.innerHTML = '';

            if (data.length === 0) {
                listEl.innerHTML = `
                    <div class="text-center py-12 text-gray-500 font-medium text-xs">
                        <i class="fa-solid fa-box-open text-3xl mb-2 block text-gray-600"></i>
                        Aucun conteneur pointé pour le moment.
                    </div>
                `;
                return;
            }

            data.forEach((item, index) => {
                const isGood = item.status === 'Bon état';
                const badgeClass = isGood ? 'badge-green' : 'badge-red';

                // Display custom fields summary
                let customFieldsHTML = '';
                if (item.customData && Object.keys(item.customData).length > 0) {
                    customFieldsHTML = `<div class="flex flex-wrap gap-2 pt-1 text-[11px] text-gray-300">`;
                    for (const [key, val] of Object.entries(item.customData)) {
                        if (val) customFieldsHTML += `<span class="bg-[#242426] px-2 py-0.5 rounded border border-gray-700"><b>${key}:</b> ${val}</span>`;
                    }
                    customFieldsHTML += `</div>`;
                }

                const card = document.createElement('div');
                card.className = "card-dark p-4 rounded-2xl space-y-2 text-xs mb-3 shadow-sm relative";
                card.innerHTML = `
                    <div class="flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <h4 class="font-extrabold text-base tracking-wider text-white">${item.id}</h4>
                            <span class="px-2 py-0.5 rounded-md font-semibold text-[10px] badge-blue">${item.model}</span>
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="px-2.5 py-1 rounded-full font-bold text-[11px] ${badgeClass}">${item.status}</span>
                            <button onclick="deleteContainer(${index})" class="text-gray-500 hover:text-red-500 p-1.5 transition"><i class="fa-solid fa-trash-can text-sm"></i></button>
                        </div>
                    </div>
                    <p class="text-gray-400 font-medium text-xs">${item.type} • ${item.loc} • Plomb: ${item.seal}</p>
                    ${customFieldsHTML}
                    <div class="flex items-center gap-3 text-gray-400 text-[11px] pt-1 border-t border-gray-800/60">
                        <span>${item.time}</span>
                        <span>•</span>
                        <span>${item.date}</span>
                    </div>
                `;
                listEl.appendChild(card);
            });
        }

        function filterContainers() {
            const val = document.getElementById('filterStatus').value;
            if (val === 'All') renderList(containers);
            else renderList(containers.filter(c => c.status === val));
        }

        function openModal() { 
            populateModelSelect();
            document.getElementById('modalOverlay').classList.remove('hidden'); 
        }
        function closeModal() { document.getElementById('modalOverlay').classList.add('hidden'); }

        function deleteContainer(index) {
            if (confirm("Voulez-vous vraiment supprimer ce conteneur ?")) {
                containers.splice(index, 1);
                saveContainers();
                renderList();
            }
        }

        function handleSave(e) {
            e.preventDefault();
            const now = new Date();
            const timeStr = `${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            const selectedModel = document.getElementById('inpModel').value;

            // Collect Custom Fields
            const customData = {};
            const customInputs = document.querySelectorAll('[data-custom-field]');
            customInputs.forEach(input => {
                const fieldName = input.getAttribute('data-custom-field');
                customData[fieldName] = input.value || '-';
            });

            const newItem = {
                id: document.getElementById('inpId').value.toUpperCase(),
                model: selectedModel,
                type: document.getElementById('inpType').value,
                loc: document.getElementById('inpLoc').value.toUpperCase(),
                status: document.getElementById('inpStatus').value,
                seal: document.getElementById('inpSeal').value.toUpperCase() || 'SL-00000',
                notes: document.getElementById('inpNotes').value || 'RAS',
                customData: customData,
                time: timeStr,
                date: now.toLocaleDateString('fr-FR')
            };

            containers.unshift(newItem);
            saveContainers();
            renderList();
            closeModal();
            
            document.getElementById('inpId').value = '';
            document.getElementById('inpLoc').value = '';
            document.getElementById('inpSeal').value = '';
            document.getElementById('inpNotes').value = '';
        }

        // Export to Multi-sheet Excel workbook with custom columns per model
        function exportToExcel() {
            if (containers.length === 0) {
                alert("Aucun conteneur à exporter.");
                return;
            }

            const workbook = XLSX.utils.book_new();

            // Export each Model into its own customized Sheet
            Object.keys(modelConfigs).forEach(mName => {
                const filtered = containers.filter(c => c.model === mName);
                if (filtered.length > 0) {
                    const modelData = filtered.map(c => {
                        let rowObj = {
                            "Date": c.date,
                            "Heure": c.time,
                            "N° Conteneur": c.id,
                            "Type & Taille": c.type,
                            "Emplacement": c.loc,
                            "État": c.status,
                            "N° Plomb": c.seal
                        };

                        // Add model specific dynamic columns to Excel
                        if (c.customData) {
                            for (const [k, v] of Object.entries(c.customData)) {
                                rowObj[k] = v;
                            }
                        }

                        rowObj["Remarques"] = c.notes;
                        return rowObj;
                    });

                    const wsModel = XLSX.utils.json_to_sheet(modelData);
                    XLSX.utils.book_append_sheet(workbook, wsModel, mName.substring(0, 30));
                }
            });

            const fileName = `Pointeur_DPW_${new Date().toISOString().slice(0, 10)}.xlsx`;
            XLSX.writeFile(workbook, fileName);
        }

        populateModelSelect();
        renderList();
    </script>
</body>
</html>
